name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
          
    - name: Download dependencies
      run: go mod download
      
    - name: Run tests
      run: make test
      
    - name: Test coverage
      run: go test -v -coverprofile=coverage.out ./api/
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        
    - name: Build application
      run: go build -v -o mailhog .
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: mailhog-binary
        path: mailhog
        
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: mailhog-binary
        
    - name: Make binary executable
      run: chmod +x mailhog
      
    - name: Start MailHog
      run: ./mailhog &
      
    - name: Wait for startup
      run: sleep 3
      
    - name: Test health endpoints
      run: |
        echo "Testing health endpoint..."
        curl -f -s http://localhost:8025/health | jq '.'
        
        echo "Testing readiness endpoint..."
        curl -f -s http://localhost:8025/ready | jq '.'
        
        echo "Testing metrics endpoint..."
        curl -f -s http://localhost:8025/metrics | head -10
        
    - name: Test SMTP functionality
      run: |
        echo "Testing SMTP server..."
        nc -z localhost 1025 || (echo "SMTP port not accessible" && exit 1)
        
    - name: Test Web UI
      run: |
        echo "Testing Web UI..."
        curl -f -s http://localhost:8025/ | grep -i mailhog
        
    - name: Stop MailHog
      run: pkill mailhog || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: mailhog:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max